name: NMFTA
description: 'The National Motor Freight Traffic Association (NMFTA) is the nonprofit membership body
  that has set the standards for North American freight since 1956, and through its Digital Standards
  Development Council (DSDC) it publishes that industry agreement as open OpenAPI contracts. Two councils
  sit under the DSDC — the Digital LTL Council, founded November 2020, and the Digital FTL Council, which
  absorbed the Scheduling Standards Consortium — and between them they turn the paper artifacts of trucking
  into machine-readable APIs: the electronic bill of lading, the rate quote, the invoice and supporting
  documents, in-transit visibility, appointment scheduling, book and tender, and preliminary freight charges.
  For most of NMFTA''s history its standards were classification and coding — the NMFC freight classification,
  ClassIT+, SCAC carrier codes, SPLC location codes — and the DSDC is the same institution doing the same
  job for the API layer. It is one of the clearest examples of an old, mandate-free trade association
  choosing specifications-as-code over another PDF behind a membership wall, and the gap between what
  its website advertises as released and what its public repositories actually contain is the most interesting
  thing about it.'
