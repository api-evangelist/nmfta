findings:
- id: no-server-declarations
  observation: >-
    All six harvested DSDC OpenAPI documents declare an empty or absent `servers` block. Not a
    template variable, not a placeholder host — nothing. CAMARA at least publishes `{apiRoot}`;
    DSDC publishes no base URL at all, so the specification cannot be pointed at any endpoint
    without out-of-band knowledge from a carrier.
  evidence: nmfta/openapi/_original/*.yml
- id: site-ahead-of-repo
  observation: >-
    dsdc.nmfta.org/apis advertises every FTL API as version 1.1.0 Released. The dsdcapis GitHub
    organization publishes only v1.0-public-preview for the four FTL specs that exist there, and
    has no specification at all for Book and Tender or Appointment Scheduling. The public
    contract is a minor version behind the public claim.
  evidence:
  - https://dsdc.nmfta.org/apis
  - https://github.com/dsdcapis/full-truckload
- id: ltl-behind-a-form
  observation: >-
    The LTL council's specifications are distributed through a lead-capture download form on the
    DSDC site rather than committed to the public repositories, with the single exception of
    Preliminary Freight Charges. The FTL council commits to GitHub. Two councils in one body,
    with opposite distribution postures.
- id: thin-working-surface
  observation: >-
    The dsdcapis organization has six repositories, two of which are named test repositories
    (Public-Test-Repo, Public-Test-FullTruckload), five human contributors and 123 total
    contributions across its history. For an industry standard adopted by the largest carriers
    in North America, the public engineering surface is very small.
  evidence: nmfta/repositories/nmfta-repositories.yml
